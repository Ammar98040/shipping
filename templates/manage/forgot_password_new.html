{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمة المرور الجديدة | دولابك — الإدارة</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/manage.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="manage-body manage-login-page dir-rtl">
  <div class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-brand-logo" aria-hidden="true">
        <span class="auth-logo-top"></span>
        <span class="auth-logo-body"></span>
        <span class="auth-logo-door auth-logo-door--left"></span>
        <span class="auth-logo-door auth-logo-door--right"></span>
      </div>
      <h1 class="auth-title">كلمة المرور الجديدة</h1>
      <p class="auth-subtitle">الحساب المرتبط: {{ email }}</p>
    </div>
    {% if messages %}
    <ul class="manage-messages">
      {% for message in messages %}
      <li class="manage-message {{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    <form method="post" class="auth-form" action="{% url 'manage:forgot_password_new_password' %}">
      {% csrf_token %}
      <div class="auth-field">
        <span class="auth-field-icon">🔒</span>
        <input type="password" name="password1" class="input" required minlength="6" placeholder=" " autocomplete="new-password">
        <label>كلمة المرور الجديدة</label>
      </div>
      <div class="auth-field">
        <span class="auth-field-icon">✅</span>
        <input type="password" name="password2" class="input" required minlength="6" placeholder=" " autocomplete="new-password">
        <label>تأكيد كلمة المرور</label>
      </div>
      <button type="submit" class="btn-submit">حفظ</button>
    </form>
    <div class="auth-links">
      <p><a href="{% url 'manage:forgot_password' %}">إلغاء والبدء من جديد</a></p>
      <p><a href="{% url 'manage:login' %}">العودة لتسجيل الدخول</a></p>
    </div>
  </div>
  </div>
  <script src="{% static 'js/auth-floating.js' %}"></script>
</body>
</html>
