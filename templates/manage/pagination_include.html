{% if page_obj.has_other_pages %}
<nav class="manage-pagination" aria-label="ترقيم الصفحات">
    <div class="pagination-inner">
        {% if page_obj.has_previous %}
        <a href="?{% if query_string %}{{ query_string }}&{% endif %}page=1" class="pagination-btn">« الأولى</a>
        <a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.previous_page_number }}" class="pagination-btn">‹ السابق</a>
        {% endif %}
        <span class="pagination-info">
            صفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} نتيجة)
        </span>
        {% if page_obj.has_next %}
        <a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.next_page_number }}" class="pagination-btn">التالي ›</a>
        <a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.paginator.num_pages }}" class="pagination-btn">الأخيرة »</a>
        {% endif %}
    </div>
</nav>
{% endif %}
